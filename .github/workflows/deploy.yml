name: 本番公開（さくらへ転送）

# main ブランチに変更が入ると、サイトを組み立ててさくらのサーバーへ転送します。
# 手動で流したいときは Actions タブから「Run workflow」を押してください。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # さくらは国外IPアドレスフィルターで海外からの FTP を拒否しているため、
    # GitHub のサーバー（海外）ではなく、日本信達の Mac mini（国内）で実行します。
    # Mac mini 側のランナーは ~/actions-runner-tomapufarm（README「公開の仕組み」参照）。
    runs-on: [self-hosted, tomapufarm-deploy]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # さくらの接続情報がまだ登録されていない間は、転送せずビルド確認だけで終わります。
      # （未登録のまま転送を試みると毎回失敗して赤くなり、本当の異常が埋もれるため）
      - name: さくらの接続情報があるか確認
        id: creds
        env:
          SERVER: ${{ secrets.SAKURA_FTP_SERVER }}
          SERVER_DIR: ${{ secrets.SAKURA_SERVER_DIR }}
          USERNAME: ${{ secrets.SAKURA_FTP_USERNAME }}
          PASSWORD: ${{ secrets.SAKURA_FTP_PASSWORD }}
        run: |
          if [ -z "$SERVER" ] || [ -z "$SERVER_DIR" ] || [ -z "$USERNAME" ] || [ -z "$PASSWORD" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=転送は行いません::さくらの接続情報（Secrets）が未登録です。ビルドの確認だけで終了しました。SAKURA_FTP_SERVER / SAKURA_FTP_USERNAME / SAKURA_FTP_PASSWORD / SAKURA_SERVER_DIR を登録してから再実行してください。"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 出来上がったページの一覧
        run: find dist -name '*.html' | sort

      # 転送は Mac mini の lftp で行う（brew install lftp）。
      # SamKirkland/FTP-Deploy-Action は、さくらの FTP サーバー（ProFTPD）との暗号化の相性で
      # データ通信が切断されるため使っていない（2026-09-24 に確認）。
      # api/config.php（APIキー）と api/mail.log はサーバーにだけ置くファイルなので、除外して触らない。
      - name: さくらへ転送
        if: steps.creds.outputs.ready == 'true'
        env:
          FTP_SERVER: ${{ secrets.SAKURA_FTP_SERVER }}
          FTP_USER: ${{ secrets.SAKURA_FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.SAKURA_FTP_PASSWORD }}
          SERVER_DIR: ${{ secrets.SAKURA_SERVER_DIR }}
        run: |
          LFTP="$(command -v lftp || echo /opt/homebrew/bin/lftp)"
          "$LFTP" -e "
            set cmd:fail-exit true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set net:max-retries 3;
            set net:timeout 30;
            open --env-password -u \"$FTP_USER\" \"$FTP_SERVER\";
            mkdir -p -f \"$SERVER_DIR\";
            mirror --reverse --delete --no-perms --parallel=4 \
              --exclude-glob api/config.php --exclude-glob api/mail.log \
              --exclude-glob .ftp-deploy-sync-state.json \
              ./dist/ \"$SERVER_DIR\";
            bye
          "
          echo "転送が完了しました。"
