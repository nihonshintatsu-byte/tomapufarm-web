name: 本番公開（さくらへ転送）

# main ブランチに変更が入ると、サイトを組み立ててさくらのサーバーへ転送します。
# 手動で流したいときは Actions タブから「Run workflow」を押してください。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # さくらの接続情報がまだ登録されていない間は、転送せずビルド確認だけで終わります。
      # （未登録のまま転送を試みると毎回失敗して赤くなり、本当の異常が埋もれるため）
      - name: さくらの接続情報があるか確認
        id: creds
        env:
          SERVER: ${{ secrets.SAKURA_FTP_SERVER }}
          SERVER_DIR: ${{ secrets.SAKURA_SERVER_DIR }}
        run: |
          if [ -z "$SERVER" ] || [ -z "$SERVER_DIR" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=転送は行いません::さくらの接続情報（Secrets）が未登録です。ビルドの確認だけで終了しました。SAKURA_FTP_SERVER / SAKURA_FTP_USERNAME / SAKURA_FTP_PASSWORD / SAKURA_SERVER_DIR を登録してから再実行してください。"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 出来上がったページの一覧
        run: find dist -name '*.html' | sort

      - name: さくらへ転送（変更があったファイルだけ）
        if: steps.creds.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SAKURA_FTP_SERVER }}
          username: ${{ secrets.SAKURA_FTP_USERNAME }}
          password: ${{ secrets.SAKURA_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.SAKURA_SERVER_DIR }}
          # サーバー側だけに置くファイルは触らない
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            api/config.php
            api/mail.log
