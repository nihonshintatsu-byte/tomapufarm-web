name: 本番公開（さくらへ転送）

# main ブランチに変更が入ると、サイトを組み立ててさくらのサーバーへ転送します。
# 手動で流したいときは Actions タブから「Run workflow」を押してください。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: さくらへ転送（変更があったファイルだけ）
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SAKURA_FTP_SERVER }}
          username: ${{ secrets.SAKURA_FTP_USERNAME }}
          password: ${{ secrets.SAKURA_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.SAKURA_SERVER_DIR }}
          # サーバー側だけに置くファイルは触らない
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            api/config.php
            api/mail.log
