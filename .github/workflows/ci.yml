name: ビルド確認

# Pull Request が作られたら、サイトがちゃんと組み上がるか確かめます。
# ここが緑（成功）になっていない PR はマージしないでください。
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 出来上がったページの一覧
        run: find dist -name '*.html' | sort
